<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Style: hand-drawn line art on transparent bg, thin white strokes + light-grey fills -->
  <defs>
    <style>
      .stroke { stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stroke-thin { stroke: #ffffff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .fill-light { fill: #d6d6dc; }
      .fill-darker { fill: #9fa0a8; }
    </style>
  </defs>

  <!-- Shelving rack on the right -->
  <g>
    <!-- Frame -->
    <path class="stroke" d="M210 60 L382 60 L382 290 L210 290 Z" />
    <!-- Shelves -->
    <path class="stroke" d="M210 138 L382 138" />
    <path class="stroke" d="M210 216 L382 216" />

    <!-- Top shelf products -->
    <g>
      <!-- Box product -->
      <rect class="fill-light stroke" x="226" y="92" width="32" height="44" rx="3" />
      <path class="stroke-thin" d="M232 102 L252 102 M232 110 L246 110" />
      <!-- Bottle product -->
      <path class="fill-light stroke" d="M276 96 q0 -6 6 -6 l8 0 q6 0 6 6 l0 12 q4 4 4 10 l0 18 l-28 0 l0 -18 q0 -6 4 -10 Z" />
      <path class="stroke-thin" d="M278 122 l20 0" />
      <!-- Can product -->
      <rect class="fill-light stroke" x="320" y="96" width="28" height="40" rx="3" />
      <path class="stroke-thin" d="M324 108 q4 -4 10 0 q4 4 10 0" />
    </g>

    <!-- Middle shelf products -->
    <g>
      <rect class="fill-light stroke" x="226" y="172" width="40" height="42" rx="3" />
      <path class="stroke-thin" d="M232 184 L260 184 M232 192 L254 192" />
      <rect class="fill-light stroke" x="288" y="178" width="26" height="36" rx="3" />
      <rect class="fill-light stroke" x="334" y="170" width="40" height="44" rx="3" />
      <path class="stroke-thin" d="M340 182 L368 182" />
    </g>

    <!-- Bottom shelf products (silhouettes, partially hidden) -->
    <g>
      <rect class="fill-darker stroke-thin" x="222" y="250" width="34" height="36" rx="3" opacity="0.6" />
      <rect class="fill-darker stroke-thin" x="270" y="246" width="30" height="40" rx="3" opacity="0.6" />
      <rect class="fill-darker stroke-thin" x="320" y="252" width="42" height="34" rx="3" opacity="0.6" />
    </g>

    <!-- Date tag stickers floating on a few products -->
    <g class="stroke-thin">
      <!-- Tag on top-shelf box -->
      <path d="M256 76 l18 0 l4 6 l-4 6 l-18 0 Z" fill="#1e1e20" />
      <text x="257" y="86" font-family="Inter, system-ui, sans-serif" font-size="6.5" fill="#ffffff">02/27</text>
      <!-- Tag on middle-shelf box -->
      <path d="M334 158 l22 0 l4 6 l-4 6 l-22 0 Z" fill="#1e1e20" />
      <text x="335" y="168" font-family="Inter, system-ui, sans-serif" font-size="6.5" fill="#ffffff">11/26</text>
    </g>
  </g>

  <!-- Picker character on the left -->
  <g>
    <!-- Head -->
    <circle class="fill-light stroke" cx="92" cy="100" r="22" />
    <!-- Hair tuft -->
    <path class="stroke" d="M76 92 q4 -16 18 -18 q14 -2 20 8" />
    <!-- Eye + brow (focused/squinting) -->
    <path class="stroke-thin" d="M82 100 q3 -2 6 0" />
    <path class="stroke-thin" d="M84 96 l5 -1" />
    <!-- Mouth (small thoughtful) -->
    <path class="stroke-thin" d="M88 110 q4 1 8 0" />

    <!-- Body / shirt -->
    <path class="fill-light stroke" d="M68 122 q24 -8 48 0 l8 90 q-32 8 -64 0 Z" />
    <!-- Apron / pocket detail -->
    <path class="stroke-thin" d="M82 158 l20 0 l0 16 l-20 0 Z" />
    <path class="stroke-thin" d="M88 166 l8 0" />

    <!-- Back arm grounded down -->
    <path class="stroke" d="M70 138 q-10 30 -4 60" />

    <!-- Front arm extended toward shelf, holding magnifying glass -->
    <path class="stroke" d="M118 138 q24 -4 46 18" />

    <!-- Legs -->
    <path class="stroke" d="M82 212 q-2 30 -6 60" />
    <path class="stroke" d="M108 212 q4 30 10 60" />
    <!-- Shoes -->
    <path class="fill-darker stroke" d="M70 270 q4 -4 14 -2 l0 6 l-14 0 Z" />
    <path class="fill-darker stroke" d="M114 270 q4 -4 14 -2 l4 6 l-18 0 Z" />
  </g>

  <!-- Magnifying glass (held by front arm, pointing at top shelf area) -->
  <g>
    <!-- Handle -->
    <path class="stroke" stroke-width="3.4" d="M154 162 L184 132" />
    <!-- Lens frame -->
    <circle class="stroke" stroke-width="2.8" cx="198" cy="118" r="28" fill="#1e1e20" />
    <!-- Lens glare -->
    <path class="stroke-thin" d="M186 106 q-4 8 0 16" />
    <!-- Inside lens: small calendar icon (the "expiry date" focus) -->
    <g transform="translate(184 104)">
      <rect class="stroke-thin" x="0" y="2" width="28" height="22" rx="2" fill="none" />
      <path class="stroke-thin" d="M0 9 L28 9" />
      <path class="stroke-thin" d="M6 0 L6 5 M22 0 L22 5" />
      <!-- Tiny grid dots -->
      <circle cx="6" cy="14" r="0.9" fill="#ffffff" />
      <circle cx="12" cy="14" r="0.9" fill="#ffffff" />
      <circle cx="18" cy="14" r="0.9" fill="#ffffff" />
      <circle cx="6" cy="19" r="0.9" fill="#ffffff" />
      <circle cx="12" cy="19" r="0.9" fill="#ffffff" />
      <!-- Highlighted day -->
      <circle class="stroke-thin" cx="18" cy="19" r="2.3" fill="none" />
    </g>
  </g>

  <!-- Question mark floating above the picker (curious/searching mood) -->
  <g class="stroke" stroke-width="2">
    <path d="M50 60 q0 -10 10 -10 q10 0 10 8 q0 5 -6 8 q-4 2 -4 6" fill="none" />
    <circle cx="60" cy="80" r="1.6" fill="#ffffff" />
  </g>

  <!-- A few sparkle/scrutiny marks near the lens -->
  <g class="stroke-thin">
    <path d="M236 96 l4 -4 M238 100 l-4 4" />
    <path d="M232 144 l3 -3 M234 148 l-3 3" />
  </g>
</svg>
